[package]
name = "pbzarr-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Python bindings for the pbzarr library"
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pbzarr = { path = "../pbzarr" }
pbzarr-readers = { path = "../pbzarr-readers" }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py311"] }
indicatif = "0.17"
