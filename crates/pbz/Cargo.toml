[package]
name = "pbz"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Command-line interface for pbzarr"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
indicatif-log-bridge = "0.2"
log = "0.4"
pbzarr = { path = "../pbzarr" }
pbzarr-readers = { path = "../pbzarr-readers" }

[dev-dependencies]
tempfile = "3"
