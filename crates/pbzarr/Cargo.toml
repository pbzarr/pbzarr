[package]
name = "pbzarr"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A Zarr v3 convention for per-base resolution genomic data"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zarr", "genomics", "bioinformatics", "depth"]
categories = ["science", "encoding"]

[dependencies]
fs-err = "3"
hashbrown = "0.17.1"
log = "0.4"
md5 = "0.7.0"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zarrs = { version = "0.23", features = ["ndarray", "pcodec"] }
anyhow = "1"
crossbeam-channel = "0.5"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
