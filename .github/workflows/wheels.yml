name: Wheels

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build; empty means the triggering commit."
        type: string
        required: false
        default: ""
      cache:
        description: "Use sccache through the GitHub Actions cache."
        type: boolean
        required: false
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: macos-15, target: universal2-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: "2_28"
          sccache: ${{ inputs.cache }}
          before-script-linux: |
            dnf install -y clang-devel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - "$GITHUB_WORKSPACE/fixtures/d4/banded_1k.d4" <<'EOF'
          import sys

          import numpy as np

          import pbzarr

          pbzarr.import_d4("test.pbz", "depth", sys.argv[1])
          with pbzarr.open("test.pbz") as ds:
              view = pbzarr.region(ds["depth"], "chr1:100-110")
              np.testing.assert_array_equal(view.values, np.full(10, 11))
          print(f"wheel test ok: pbzarr {pbzarr.__version__}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
