name: CI

on:
  push:
    branches: [main, 0.8-wip]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          cache: true

      - run: pixi run test

      - run: pixi run clippy

      - run: pixi run fmt-check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          cache: true

      - run: pixi run install-wheel

      - run: pixi run test-py

      - run: pixi run validate-roundtrip

  wheels:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/wheels.yml

  binaries:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/binaries.yml
