name: CI

on:
  push:
    branches: [main, 0.8-wip]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: pixi run {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pixi run test

      - run: pixi run clippy

      - run: pixi run fmt-check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: pixi run {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pixi run install-wheel

      - run: pixi run test-py

      - run: pixi run validate-roundtrip

  wheels:
    uses: ./.github/workflows/wheels.yml

  binaries:
    uses: ./.github/workflows/binaries.yml
