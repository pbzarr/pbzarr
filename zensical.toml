[project]
site_name = "pbzarr"
site_url = "https://pbzarr.github.io"
site_description = "Per-base and binned genomic data in Zarr v3"
repo_url = "https://github.com/pbzarr/pbzarr"
repo_name = "pbzarr/pbzarr"
docs_dir = "docs"
site_dir = "site"
exclude_docs = """
DESIGN.md
"""
copyright = "Copyright &copy; 2024-2026 Cade Mirchandani"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install" = "get-started/install.md" },
  ] },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "Python API" = "reference/python.md" },
    { "Store format" = "reference/format.md" },
    { "Rust" = "reference/rust.md" },
  ] },
  { "Upgrading to 0.8" = "UPGRADING.md" },
]

[project.theme]
logo = "assets/pbzarr-icon.svg"
favicon = "assets/pbzarr-icon.svg"
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pbzarr/pbzarr"

[project.plugins.mkdocstrings]
enabled = true
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
show_root_toc_entry = false
show_symbol_type_heading = true
show_signature_annotations = true
separate_signature = true
members_order = "source"
heading_level = 2

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
