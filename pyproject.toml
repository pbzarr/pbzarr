[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pbzarr"
dynamic = ["version"]
description = "PBZ (Per-Base Zarr) — a Zarr v3 convention for per-base genomic data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cade Mirchandani", email = "cademirch@gmail.com" }]
dependencies = [
    "zarr>=3.0,<4",
    "xarray>=2025.8",
    "numpy>=2.0,<3",
    "dask>=2024.8",
    # Required: multi-region reads are reduced with xarray groupby, which needs
    # flox to be vectorized rather than a per-group Python loop.
    "flox>=0.9,<0.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "pbzarr._native"
features = ["pyo3/extension-module"]
manifest-path = "crates/pbzarr-python/Cargo.toml"
