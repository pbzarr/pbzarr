[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "pbzarr"
dynamic = ["version"]
description = "Per-base genomic data in Zarr v3 stores, read as xarray Datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cade Mirchandani", email = "cademirch@gmail.com" }]
keywords = ["genomics", "zarr", "xarray", "coverage", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "zarr>=3.2.1,<4",
    "xarray>=2025.12.0",
    "numpy>=2.4.5,<3",
    "dask>=2026.8.0",
    "pandas>=3.0.3",
    "pcodec>=1.1.0,<2",
]

[project.urls]
Homepage = "https://github.com/pbzarr/pbzarr"
Repository = "https://github.com/pbzarr/pbzarr"
Issues = "https://github.com/pbzarr/pbzarr/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "pbzarr._native"
features = ["pyo3/extension-module"]
manifest-path = "crates/pbzarr-python/Cargo.toml"
