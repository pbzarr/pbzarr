[workspace]
resolver = "2"
members = ["crates/pbzarr", "crates/pbzarr-readers", "crates/pbzarr-python"]

[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2024"
license = "MIT"
authors = ["Cade Mirchandani <cmirchan@ucsc.edu>"]
repository = "https://github.com/pbzarr/pbzarr"

[workspace.lints.clippy]
# leave defaults — CI enforces -D warnings

# Profile used by `samply` runs. Same optimizations as release, but keeps
# DWARF debuginfo so flamegraphs show function names instead of raw addresses.
# Build with `cargo build --profile profiling --example <name>`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"
