[workspace]
resolver = "2"
members = [
    "crates/pbz",
    "crates/pbzarr",
    "crates/pbzarr-readers",
    "crates/pbzarr-python",
]

[workspace.package]
version = "0.5.1" # x-release-please-version
edition = "2024"
license = "MIT"
authors = ["Cade Mirchandani <cmirchan@ucsc.edu>"]
repository = "https://github.com/pbzarr/pbzarr"

[workspace.lints.clippy]
# leave defaults — CI enforces -D warnings

# Profile used by `samply` runs. Same optimizations as release, but keeps
# DWARF debuginfo so flamegraphs show function names instead of raw addresses.
# Build with `cargo build --profile profiling --example <name>`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"

# Temporary zarrs pin: partial-decode cache below an array-to-array codec was
# built with the wrong-stage shape (transpose + pcodec reads failed). Drop when
# the fix ships upstream.
[patch.crates-io]
zarrs = { git = "https://github.com/cademirch/zarrs", rev = "cac400ebc8ba2db193e2b25df078e2d858d88229" }
