[workspace]
resolver = "2"
members = [
    "crates/pbz",
    "crates/pbzarr",
    "crates/pbzarr-readers",
    "crates/pbzarr-python",
]

[workspace.package]
version = "0.7.0" # x-release-please-version
edition = "2024"
license = "MIT"
authors = ["Cade Mirchandani <cmirchan@ucsc.edu>"]
repository = "https://github.com/pbzarr/pbzarr"

[workspace.lints.clippy]
# leave defaults — CI enforces -D warnings

# Profile used by `samply` runs. Same optimizations as release, but keeps
# DWARF debuginfo so flamegraphs show function names instead of raw addresses.
# Build with `cargo build --profile profiling --example <name>`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"

# Temporary zarrs pin (branch perf-transpose-fixed-size): the partial-decode
# cache below an array-to-array codec was built with the wrong-stage shape
# (transpose + pcodec reads failed), and the transpose codec permuted byte by
# byte (~30x slower per chunk). Drop when both fixes ship upstream.
[patch.crates-io]
zarrs = { git = "https://github.com/cademirch/zarrs", rev = "1ef8c5fa913fb1b3e064a3757ef224ac2f939547" }
